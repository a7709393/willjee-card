  var msgEl = document.getElementById("msg");
  var btn = document.getElementById("shareBtn");

  function showButton(text) {
    msgEl.textContent = text || "";
    btn.style.display = "inline-block";
  }

  function doShare() {
    if (!liff.isApiAvailable("shareTargetPicker")) {
      msgEl.textContent = "此環境不支援分享，請在 LINE App 內開啟。";
      return;
    }
    btn.disabled = true;
    msgEl.innerHTML = '<span class="spin"></span>';
    liff.shareTargetPicker([FLEX]).then(function(res){
      btn.disabled = false;
      if (res) { msgEl.textContent = "已分享，感謝您！"; btn.style.display="none"; }
      else { showButton("已取消，可再試一次"); }
    }).catch(function(err){
      btn.disabled = false;
      showButton("分享失敗，請再試一次");
      console.error(err);
    });
  }

  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isInClient()) {
      msgEl.textContent = "請在 LINE App 內開啟此連結才能分享名片。";
      return;
    }
    // 進入後直接跳出分享面板；若使用者關閉，再用按鈕重試
    doShare();
    showButton("");
    msgEl.textContent = "請選擇要分享的好友";
  }).catch(function(err){
    msgEl.textContent = "初始化失敗：" + (err && err.message ? err.message : err);
  });
